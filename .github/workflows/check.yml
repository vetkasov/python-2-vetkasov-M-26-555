name: Project checks

on:
  push:
    branches: [ver2]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - run: uv sync --locked
      - run: make check
      - name: Check installed wheel outside source tree
        run: |
          uv tool install --force dist/*.whl
          tool_bin=$(uv tool dir --bin)
          cd "$(mktemp -d)"
          printf 'help\nexit\n' | "$tool_bin/database"
